stages:
  - build

variables:
  IMAGE_NAME: "172.16.4.12:8888/dai.ta/tesst"
  IMAGE_TAG: "latest"

build-image:
  stage: build
  tags:
    - k8s-runner
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"172.16.4.12:8888\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --destination "$IMAGE_NAME:$IMAGE_TAG" --insecure --skip-tls-verify
  only:
    - main
