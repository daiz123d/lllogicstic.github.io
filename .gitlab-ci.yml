stages:
  - build

variables:
  IMAGE_NAME: "172.16.4.12:8888/dai.ta/tesst"
  IMAGE_TAG: "latest"

build-image:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=172.16.4.12:8888"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - docker login 172.16.4.12:8888 -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" .
    - docker push "$IMAGE_NAME:$IMAGE_TAG"
  only:
    - main
