apiVersion: apps/v1
kind: Deployment
metadata:
  name: weeb
  namespace: argocd
  labels:
    app: weeb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weeb
  template:
    metadata:
      labels:
        app: weeb
      annotations:
        app.kubernetes.io/rollout-version: "latest-web-code-20260622-1525"
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: weeb
          image: harbor.tinasoft.io/daita/tesst:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
